<style>
    :root{
      --orange:#f36b21; --orange2:#ff8a2a; --cream:#fff8f2; --ink:#202020;
      --muted:#707070; --line:#ece7e2; --white:#fff; --shadow:0 12px 35px rgba(40,25,10,.10);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#f4f2ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06)}
    .hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff8f2 0%,#fff 62%);padding:28px 22px 26px}
    .hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#fff0e4;right:-90px;top:-80px}
    .brand{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
    .brand b{font-size:25px;letter-spacing:-1px;color:var(--orange)}
    .badge{font-size:11px;border:1px solid #f2c4a6;color:#b85b25;padding:6px 9px;border-radius:999px;background:#fff}
    .hero-main{position:relative;z-index:2;display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin-top:26px}
    .portrait{width:150px;height:190px;object-fit:cover;object-position:center top;border-radius:28px;box-shadow:var(--shadow);background:#eee}
    .eyebrow{font-size:13px;color:var(--orange);font-weight:800;margin-bottom:4px}
    h1{font-size:31px;line-height:1.18;margin:0 0 9px;letter-spacing:-1.8px}
    .role{font-size:14px;color:#555}
    .career{display:inline-block;margin-top:10px;background:#202020;color:#fff;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700}
    .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px;position:relative;z-index:2}
    .quick a{background:#fff;border:1px solid #eee4dc;border-radius:15px;padding:12px 5px;text-align:center;font-weight:800;font-size:13px}
    .quick span{display:block;font-size:18px;margin-bottom:2px}
    .section{padding:28px 22px;border-top:8px solid #faf8f6}
    .section h2{font-size:22px;margin:0 0 15px;letter-spacing:-1px}
    .intro{font-size:15px;color:#444;word-break:keep-all}
    .intro strong{color:#222}
    .checks{display:grid;gap:9px;margin-top:17px}
    .check{padding:12px 14px;background:#fff8f2;border-radius:13px;font-weight:700;font-size:14px}
    .check:before{content:"✓";color:var(--orange);font-weight:900;margin-right:8px}
    .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .service{padding:18px 15px;border:1px solid var(--line);border-radius:18px;font-weight:800;background:#fff}
    .service small{display:block;color:#999;font-weight:500;margin-top:3px}
    .timeline{position:relative;padding-left:20px}
    .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#f2dfd2}
    .item{position:relative;padding:0 0 21px}
    .item:before{content:"";position:absolute;left:-19px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #fff3e9}
    .year{font-size:12px;color:var(--orange);font-weight:900}
    .item h3{margin:2px 0 3px;font-size:16px}
    .item p{margin:0;color:#666;font-size:13px}
    .media-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .media-grid img{width:100%;aspect-ratio:1.32;object-fit:cover;border-radius:14px;display:block;background:#eee}
    .quote{margin-top:16px;padding:19px;background:#202020;color:#fff;border-radius:20px;font-size:15px;font-weight:700;word-break:keep-all}
    .contact{background:linear-gradient(150deg,#fff5ed,#fff);text-align:center}
    .contact h2{margin-bottom:7px}
    .contact p{margin:0 0 17px;color:#666;font-size:14px}
    .contact-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:15px;font-weight:900}
    .btn.primary{background:var(--orange);color:#fff}
    .btn.secondary{background:#202020;color:#fff}
    .info{margin-top:17px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;font-size:13px;color:#555}
    .info div{margin:5px 0}
    footer{padding:20px 22px 34px;text-align:center;color:#999;font-size:11px;background:#fff}
    .floating{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(476px,calc(100% - 30px));z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .floating a{padding:13px;border-radius:16px;text-align:center;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.16)}
    .floating .call{background:#202020;color:#fff}.floating .consult{background:var(--orange);color:#fff}
    @media(max-width:390px){
      .hero-main{grid-template-columns:120px 1fr;gap:14px}
      .portrait{width:120px;height:165px}
      h1{font-size:27px}
    }
    @media(min-width:700px){body{padding:25px 0}.wrap{border-radius:28px;overflow:hidden}}
  </style>
